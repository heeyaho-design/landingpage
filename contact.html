<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마고포레스트 & 마고플레인 | 문의</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>

  <body>
    <header>
      <section class="header-inner">
        <a href="index.html" class="logo" title="마고포레스트 홈으로 이동">
          MARGAUX FOREST
        </a>

        <nav>
          <section class="nav-inner">
            <input type="checkbox" id="menu-toggle" class="menu-toggle" />

            <label for="menu-toggle" class="menu-button" title="메뉴 펼치기">
              ☰
            </label>

            <ul class="nav-menu">
              <li><a href="index.html">홈</a></li>
              <li><a href="about.html">소개</a></li>
              <li><a href="menu.html">메뉴</a></li>
              <li><a href="location.html">위치정보</a></li>
              <li><a href="contact.html">문의</a></li>
            </ul>
          </section>
        </nav>
      </section>
    </header>

    <main>
      <section class="page-title">
        <h1>RESERVATION & CONTACT</h1>
        <p>방문 예약 및 문의사항을 남겨주세요.</p>

        <p class="contact-phone">☎ 전화 : 0507-1450-5322</p>
      </section>

      <section class="content-section">
        <section class="contact-form" data-aos="fade-up">
          <h2 class="section-heading">문의하기</h2>

          <form id="contact-form">
            <label for="name">성함</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="성함을 입력하세요"
              required
            />

            <label for="phone">답변 받으실 연락처 또는 이메일</label>
            <input
              type="text"
              id="phone"
              name="phone"
              placeholder="연락처 또는 이메일을 입력하세요"
              required
            />

            <label for="date">방문 희망 날짜</label>
            <input type="date" id="date" name="date" required />

            <label for="people">방문 인원</label>
            <input
              type="number"
              id="people"
              name="people"
              min="1"
              step="1"
              placeholder="방문 인원수를 입력하세요"
              required
            />

            <label for="message">문의 내용</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="문의사항을 입력하세요"
            ></textarea>

            <button type="submit" id="submit-btn">문의 내용 제출</button>

            <p id="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>

    <footer>
      <p class="footer-logo">MARGAUX FOREST</p>
      <p>마고포레스트</p>
      <p>경북 경산시 경안로73길 20</p>
      <p>© margaux. Have a happy day!</p>
    </footer>

    <!-- 오늘 날짜 이전에는 방문 날짜 선택 불가 -->
    <script>
      const today = new Date();

      const minDate = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0"),
      ].join("-");

      document.getElementById("date").min = minDate;
    </script>

    <!-- EmailJS 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- EmailJS 문의 전송 -->
    <script>
      // EmailJS 초기화
      emailjs.init({
        publicKey: "xMGlQs2E8acu-dfd0",
      });

      const contactForm = document.getElementById("contact-form");
      const submitBtn = document.getElementById("submit-btn");
      const formStatus = document.getElementById("form-status");

      contactForm.addEventListener("submit", function (event) {
        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "전송 중...";
        formStatus.textContent = "";

        emailjs
          .sendForm("service_0tepeim", "template_1wuti5g", contactForm)
          .then(function () {
            formStatus.textContent = "문의가 정상적으로 전송되었습니다.";

            contactForm.reset();
          })
          .catch(function (error) {
            console.error("EmailJS 전송 오류:", error);

            formStatus.textContent =
              "전송에 실패했습니다. 잠시 후 다시 시도해주세요.";
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "문의 내용 제출";
          });
      });
    </script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
      AOS.init({
        once: false,
        mirror: true,
        offset: 120,
        duration: 700,
        easing: "ease-out-cubic",
        disable: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      });
    </script>
  </body>
</html>
