<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARGAUX FOREST | 홈</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <!-- 상단 헤더 및 메뉴 -->
    <header>
      <section class="header-inner">
        <a href="index.html" class="logo" title="마고포레스트 홈으로 이동">
          MARGAUX FOREST
        </a>

        <nav>
          <section class="nav-inner">
            <input type="checkbox" id="menu-toggle" class="menu-toggle" />

            <label for="menu-toggle" class="menu-button" title="메뉴 펼치기">
              ☰
            </label>

            <ul class="nav-menu">
              <li><a href="index.html">홈</a></li>
              <li><a href="about.html">소개</a></li>
              <li><a href="menu.html">메뉴</a></li>
              <li><a href="location.html">매장안내</a></li>
              <li><a href="contact.html">예약·문의</a></li>
            </ul>
          </section>
        </nav>
      </section>
    </header>

    <!-- 메인 콘텐츠 -->
    <main>
      <!-- 첫 화면 : 자동 사진 슬라이드 -->
      <section class="hero">
        <section class="hero-slideshow">
          <img src="images/건물 사진.jfif" alt="건물 사진" />

          <img
            src="images/마고플레인 풍경.jfif"
            alt="마고포레스트의 넓고 자연 친화적인 카페 전경"
          />

          <img src="images/홈 배경.jfif" alt="카운터를 바라보는 사진" />
        </section>

        <!-- 첫 화면 문구 -->
        <section class="hero-text">
          <p>자연 속에서 즐기는 여유로운 시간</p>

          <h1>MARGAUX FOREST</h1>

          <p>일상에서 벗어나 함께 쉬어가는 공간</p>
        </section>

        <!-- 스크롤 안내 -->
        <section class="scroll-guide">
          <p>SCROLL DOWN</p>

          <span>⌄</span>
        </section>
      </section>

      <!-- 소개 글 및 카페 둘러보기 -->
      <section class="home-intro">
        <section class="intro-text">
          <h2>자연과 여유가 머무는 공간</h2>

          <p>
            넓고 여유로운 공간에서 자연의 분위기를 느끼며 편안한 시간을
            보내보세요.
          </p>
        </section>

        <a
          href="about.html"
          class="explore-button"
          title="마고포레스트 소개 페이지로 이동"
        >
          카페 둘러보기 →
        </a>
      </section>
    </main>

    <!-- 마지막 푸터 -->
    <footer>
      <p class="footer-logo">MARGAUX FOREST</p>
      <p>마고포레스트</p>
      <p>경북 경산시 경안로73길 20</p>
      <p>© margaux. Have a happy day!</p>
    </footer>
  </body>
</html>
