        <nav>

      <!-- 운영 정보 -->
      <section class="content-section">
        <h2 class="section-heading">운영 정보</h2>

        <section class="operation-info">

            <p>매일 08:00 ~ 23:00</p>

        <section class="address-box">
          <p>
            <strong>도로명</strong>
            <span>경북 경산시 경안로73길 20 마고포레스트</span>

          </p>

          <a
            href="https://map.naver.com/p/search/마고포레스트"
            target="_blank"
            rel="noopener noreferrer"
          >
            네이버 지도에서 길찾기
