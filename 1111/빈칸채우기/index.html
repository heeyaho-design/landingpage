<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주말 영화관</title>

  <!-- base.css : 색, 글자, 여백을 담당 (이미 완성되어 있어요) -->
  <link rel="stylesheet" href="base.css">
  <!-- layout.css : 배치를 담당 (빈칸을 채울 파일) -->
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <div class="page">

    <!-- 1. 맨 위 줄 : 사이트 이름 + 메뉴 링크 -->
    <header class="top">
      <h1 class="site-name">주말 영화관</h1>
      <div class="top-menu">
        <a class="top-link" href="#">상영작</a>
        <a class="top-link" href="#">순위</a>
        <a class="top-link" href="#">내 보관함</a>
      </div>
    </header>

    <!-- 2. 가운데 : 왼쪽 순위 상자 + 오른쪽 영화 목록 -->
    <div class="layout">

      <!-- 2-1. 왼쪽 : 이번 주 순위 -->
      <div class="side">
        <h2 class="box-title">이번 주 순위</h2>
        <div class="rank-list">
          <div class="rank-item">
            <span class="rank-num">1</span>
            <span class="rank-title">달빛 정류장</span>
            <span class="rank-score">9.2</span>
          </div>
          <div class="rank-item">
            <span class="rank-num">2</span>
            <span class="rank-title">고양이 탐정</span>
            <span class="rank-score">8.9</span>
          </div>
          <div class="rank-item">
            <span class="rank-num">3</span>
            <span class="rank-title">여름의 끝</span>
            <span class="rank-score">8.7</span>
          </div>
          <div class="rank-item">
            <span class="rank-num">4</span>
            <span class="rank-title">마지막 기차</span>
            <span class="rank-score">8.4</span>
          </div>
          <div class="rank-item">
            <span class="rank-num">5</span>
            <span class="rank-title">별빛 캠핑</span>
            <span class="rank-score">8.1</span>
          </div>
        </div>
      </div>

      <!-- 2-2. 오른쪽 : 장르 태그 + 영화 카드 -->
      <div class="main">
        <div class="genres">
          <span class="genre">전체</span>
          <span class="genre">드라마</span>
          <span class="genre">코미디</span>
          <span class="genre">액션</span>
          <span class="genre">로맨스</span>
          <span class="genre">애니메이션</span>
          <span class="genre">스릴러</span>
          <span class="genre">판타지</span>
          <span class="genre">가족</span>
          <span class="genre">다큐멘터리</span>
          <span class="genre">음악</span>
          <span class="genre">모험</span>
        </div>

        <div class="poster-grid">
          <div class="poster">
            <img class="poster-img" src="images/movie1.svg" alt="달빛 정류장 장면 그림">
            <p class="poster-title">달빛 정류장</p>
            <p class="poster-info">드라마 · 112분</p>
          </div>
          <div class="poster">
            <img class="poster-img" src="images/movie2.svg" alt="고양이 탐정 장면 그림">
            <p class="poster-title">고양이 탐정</p>
            <p class="poster-info">코미디 · 98분</p>
          </div>
          <div class="poster">
            <img class="poster-img" src="images/movie3.svg" alt="여름의 끝 장면 그림">
            <p class="poster-title">여름의 끝</p>
            <p class="poster-info">로맨스 · 105분</p>
          </div>
          <div class="poster">
            <img class="poster-img" src="images/movie4.svg" alt="마지막 기차 장면 그림">
            <p class="poster-title">마지막 기차</p>
            <p class="poster-info">모험 · 121분</p>
          </div>
          <div class="notice">
            <p class="notice-title">이번 주말 뭐 보지?</p>
            <p class="notice-text">토요일 저녁 8시, 순위 1위 영화를 함께 봐요. 팝콘은 각자 준비!</p>
          </div>
        </div>
      </div>

    </div>

    <!-- 3. 맨 아래 줄 -->
    <footer class="bottom">
      <a class="bottom-link" href="#">이용 안내</a>
      <a class="bottom-link" href="#">자주 묻는 질문</a>
      <a class="bottom-link" href="#">문의하기</a>
    </footer>

  </div>
</body>
</html>
